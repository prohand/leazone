name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go vet and tests
        run: |
          test -z "$(gofmt -l ./cmd ./internal ./api ./web)"
          go vet ./...
          go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Phase 1 integration test (image, non-root, read-only, capabilities)
        run: test/integration/phase1.sh
      - name: Docker scenarios (DNS on test interfaces, hot add, forwarding, port conflict)
        run: sudo -E env "PATH=$PATH" LEAZONE_TEST_IMAGE=leazone:phase1-test BUSYBOX_IMAGE=busybox:1.36 go test -tags integration -count=1 -v -timeout 30m ./test/integration/
