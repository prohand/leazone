name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

# Actions are pinned by full commit SHA (tag in the comment); Dependabot
# (.github/dependabot.yml) proposes the updates.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Go vet and tests
        run: |
          test -z "$(gofmt -l ./cmd ./internal ./api ./web)"
          go vet ./...
          go test -race -count=1 ./...

  vulns:
    name: Known vulnerabilities (Go and npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: npm audit (runtime dependencies, high and critical)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Multi-arch build check (amd64 + arm64, not pushed)
        run: docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION=0.0.0-ci .
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Phase 1 integration test (image, non-root, read-only, capabilities)
        run: test/integration/phase1.sh
      - name: Independent DNSSEC validator image (BIND delv)
        run: docker build -t lz-delv -f test/integration/delv.Dockerfile test/integration
      - name: Docker scenarios (DNS, DHCP multi-VLAN, HA, modules, logs, backup)
        env:
          # Pinned by digest (multi-arch index).
          BUSYBOX_IMAGE: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        run: sudo -E env "PATH=$PATH" LEAZONE_TEST_IMAGE=leazone:phase1-test BUSYBOX_IMAGE="$BUSYBOX_IMAGE" go test -tags integration -count=1 -v -timeout 30m ./test/integration/
