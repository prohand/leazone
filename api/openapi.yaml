openapi: 3.1.0
info:
  title: Leazone API
  version: 1.0.0
  description: |
    REST JSON API of Leazone (DNS + DHCP with high availability).

    Authentication:
      - Browser: session cookie `__Host-leazone_session` + header `X-CSRF-Token`
        (value from `GET /auth/session`) on every non-GET request.
      - Scripts: `Authorization: Bearer lz_<prefix>_<secret>` (API tokens, no CSRF).

    Errors use RFC 9457 `application/problem+json`. The `type` field is stable:
      - `urn:leazone:unauthenticated` (401)
      - `urn:leazone:forbidden` (403)
      - `urn:leazone:step-up-required` (403) -> re-verify with passkey/TOTP, see /auth/step-up/*
      - `urn:leazone:mfa-required` (403) -> session is not fully authenticated
      - `urn:leazone:rate-limited` (429) -> `retryAfter` seconds
      - `urn:leazone:validation` (422) -> `errors` map field -> message
      - `urn:leazone:not-found` (404), `urn:leazone:conflict` (409)
      - `urn:leazone:csrf` (403)
      - `urn:leazone:upstream` (502) -> a remote server (Technitium import) failed
      - `urn:leazone:not-primary` (409) -> this node is a cluster secondary: config is read-only here; `primaryUrl` gives the primary UI
      - `urn:leazone:read-only` (409) -> config temporarily read-only (update in progress, switchover)
servers:
  - url: /api/v1
security:
  - session: []
  - token: []

paths:
  /system/info:
    get:
      summary: Public information used by the login page
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }

  /auth/session:
    get:
      summary: Current session state (also returns the CSRF token)
      security: []
      responses:
        "200":
          description: OK (state "anonymous" when not logged in)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }

  /auth/login:
    post:
      summary: Password login (first factor)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Session created. Check `state` for the next step.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /auth/logout:
    post:
      summary: Logout (revoke current session)
      responses:
        "204": { description: Logged out }

  /auth/passkey/begin:
    post:
      summary: Start a passwordless passkey login (discoverable credential)
      security: []
      responses:
        "200":
          description: WebAuthn request options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnBegin" }
  /auth/passkey/finish:
    post:
      summary: Finish a passwordless passkey login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnFinish" }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/mfa/passkey/begin:
    post:
      summary: Start passkey verification as second factor (state mfa_required)
      responses:
        "200":
          description: WebAuthn request options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnBegin" }
  /auth/mfa/passkey/finish:
    post:
      summary: Finish passkey second factor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnFinish" }
      responses:
        "200":
          description: Session upgraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
  /auth/mfa/totp:
    post:
      summary: TOTP second factor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Session upgraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/mfa/recovery:
    post:
      summary: Recovery code as second factor (single use)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Session upgraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }

  /auth/step-up/passkey/begin:
    post:
      summary: Start a step-up (re-verification before a sensitive action)
      responses:
        "200":
          description: WebAuthn request options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnBegin" }
  /auth/step-up/passkey/finish:
    post:
      summary: Finish passkey step-up
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnFinish" }
      responses:
        "200":
          description: Session elevated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
  /auth/step-up/totp:
    post:
      summary: TOTP step-up
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Session elevated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }

  /me:
    get:
      summary: Current user profile and MFA status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
  /me/password:
    post:
      summary: Change own password. Revokes the other sessions and all the API tokens of the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        "204": { description: Changed }

  /me/passkeys:
    get:
      summary: List own passkeys
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Passkey" } }
  /me/passkeys/begin:
    post:
      summary: Start passkey registration (step-up required once the account has a passkey or TOTP, except during the forced MFA setup)
      responses:
        "200":
          description: WebAuthn creation options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnBegin" }
        "403": { $ref: "#/components/responses/Problem" }
  /me/passkeys/finish:
    post:
      summary: Finish passkey registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebAuthnFinish"
                - type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Registered. `recoveryCodes` is set only when this is the first MFA method.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrollResult" }
  /me/passkeys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Rename a passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
    delete:
      summary: Delete a passkey (step-up required)
      responses:
        "204": { description: Deleted }

  /me/totp:
    get:
      summary: TOTP status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
    delete:
      summary: Disable TOTP (step-up required)
      responses:
        "204": { description: Disabled }
  /me/totp/setup:
    post:
      summary: Generate a new TOTP secret, not active until confirmed (step-up required once the account has a passkey or TOTP, except during the forced MFA setup)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauthUrl: { type: string }
                  qrPng: { type: string, description: "data:image/png;base64,..." }
        "403": { $ref: "#/components/responses/Problem" }
  /me/totp/confirm:
    post:
      summary: Confirm the TOTP secret with a code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Enabled. `recoveryCodes` is set only when this is the first MFA method.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrollResult" }

  /me/recovery-codes:
    get:
      summary: Number of unused recovery codes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  remaining: { type: integer }
    post:
      summary: Regenerate the 10 recovery codes (step-up required). Old ones stop working.
      responses:
        "200":
          description: New codes, shown only once
          content:
            application/json:
              schema:
                type: object
                properties:
                  codes: { type: array, items: { type: string } }

  /me/sessions:
    get:
      summary: List own active sessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Session" } }
  /me/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Revoke one of own sessions
      responses:
        "204": { description: Revoked }

  /me/tokens:
    get:
      summary: List own API tokens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
    post:
      summary: Create an API token, secret returned once (step-up required when the account has a passkey or TOTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name: { type: string, maxLength: 64 }
                scope: { type: string, enum: [read, write] }
                expiresAt: { type: [string, "null"], format: date-time }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  item: { $ref: "#/components/schemas/ApiToken" }
        "403": { $ref: "#/components/responses/Problem" }
  /me/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Revoke an API token
      responses:
        "204": { description: Revoked }

  /users:
    get:
      summary: List users (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      summary: Create a user (admin). If password is empty, a temporary one is generated and returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{1,31}$" }
                role: { $ref: "#/components/schemas/Role" }
                password: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/User" }
                  temporaryPassword: { type: [string, "null"] }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Update role or disable a user (admin, step-up required). A role change or a deactivation ends the user's sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/Role" }
                disabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      summary: Delete a user (admin, step-up required)
      responses:
        "204": { description: Deleted }
  /users/{id}/reset-mfa:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Remove all MFA methods of a user (admin, step-up required). Revokes the user's sessions and API tokens; the user must set up MFA again.
      responses:
        "204": { description: Done }
  /users/{id}/reset-password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Set a temporary password (admin, step-up required). Revokes the user's sessions and API tokens.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  temporaryPassword: { type: string }

  /settings/security:
    get:
      summary: Security settings (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
    put:
      summary: Update security settings (admin, step-up required). Sessions of users who must now use MFA but have no accepted factor are ended.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecuritySettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }

  /settings/tls:
    get:
      summary: Current HTTPS certificate (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TlsInfo" }
    post:
      summary: Import a certificate + private key in PEM (admin, step-up required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certPem, keyPem]
              properties:
                certPem: { type: string, description: "Leaf first, then intermediates" }
                keyPem: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TlsInfo" }

  /audit:
    get:
      summary: Audit log (admin), newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: "Search in actor, action, target" }
        - { name: action, in: query, schema: { type: string }, description: "Action prefix, e.g. auth." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  nextCursor: { type: [string, "null"] }

  /interfaces:
    get:
      summary: Network interfaces of the host (physical, VLAN, bond, bridge) with Leazone settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/NetInterface" } }
  /interfaces/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    patch:
      summary: Enable or disable DNS / DHCP on an interface (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dnsEnabled: { type: boolean }
                dhcpEnabled: { type: boolean, description: "Stored now, used from phase 3" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetInterface" }

  /dns/settings:
    get:
      summary: DNS server settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsSettings" }
    put:
      summary: Update DNS server settings (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DnsSettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsSettings" }
  /dns/status:
    get:
      summary: Listeners, cache and forwarder health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsStatus" }
  /dns/cache/flush:
    post:
      summary: Empty the cache, or only the entries of one name and its sub-names (records.write)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: "Empty = whole cache" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: integer }
  /dns/lookup:
    post:
      summary: Resolve a name like a client would (test tool)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, example: A }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupResult" }

  /dns/zones:
    get:
      summary: List zones
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Zone" } }
    post:
      summary: Create a zone (config.write). For a reverse zone, `name` may be a network like 192.168.1.0/24.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
  /dns/zones/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: One zone
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
    patch:
      summary: Update default TTL / SOA (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl: { type: integer }
                soa: { $ref: "#/components/schemas/Soa" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
    delete:
      summary: Delete a zone and its records (config.write, step-up required)
      responses:
        "204": { description: Deleted }
  /dns/zones/{id}/export:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Zone in BIND (RFC 1035) format
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string }
  /dns/zones/{id}/import:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Import records from a BIND zone file (records.write). SOA lines are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                replace: { type: boolean, description: "Delete existing records first", default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  skipped: { type: integer }
                  errors: { type: array, items: { type: string } }
  /dns/zones/{id}/records:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Records of a zone
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Record" } }
    post:
      summary: Add a record (records.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
  /dns/zones/{id}/records/{rid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: rid, in: path, required: true, schema: { type: string } }
    put:
      summary: Replace a record (records.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
    delete:
      summary: Delete a record (records.write)
      responses:
        "204": { description: Deleted }

  /dns/forwarders:
    get:
      summary: Global and conditional forwarders, ordered by domain then position
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Forwarder" } }
    post:
      summary: Add a forwarder (config.write). It is placed last in its group unless position is given.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForwarderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Forwarder" }
  /dns/forwarders/test:
    post:
      summary: Test a forwarder configuration without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForwarderInput" }
      responses:
        "200":
          description: Test result (ok=false on failure, never an HTTP error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForwarderTest" }
  /dns/forwarders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Replace a forwarder (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForwarderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Forwarder" }
    delete:
      summary: Delete a forwarder (config.write)
      responses:
        "204": { description: Deleted }
  /dns/forwarders/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Test a saved forwarder (any role)
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForwarderTest" }

  /vlans:
    get:
      summary: VLAN overview (labels + VLANs detected on the host) with scope usage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/VlanOverview" } }
                  untaggedScopes: { type: array, items: { $ref: "#/components/schemas/ScopeUsage" }, description: "Scopes not linked to a VLAN" }
    post:
      summary: Give a name to a VLAN ID (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VlanInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vlan" }
  /vlans/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Rename / change a VLAN label (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VlanInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vlan" }
    delete:
      summary: Delete a VLAN label (config.write). Refused while scopes use it.
      responses:
        "204": { description: Deleted }

  /dhcp/status:
    get:
      summary: DHCP server state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DhcpStatus" }
  /dhcp/scopes:
    get:
      summary: List scopes with usage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Scope" } }
    post:
      summary: Create a scope (config.write). The reverse DNS zone of its network is created automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScopeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scope" }
  /dhcp/scopes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: One scope
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scope" }
    put:
      summary: Replace a scope (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScopeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scope" }
    delete:
      summary: Delete a scope, its reservations and leases (config.write, step-up required)
      responses:
        "204": { description: Deleted }

  /dhcp/reservations:
    get:
      summary: Reservations, optionally of one scope
      parameters:
        - { name: scope, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Reservation" } }
    post:
      summary: Create a reservation (leases.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
  /dhcp/reservations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Replace a reservation (leases.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
    delete:
      summary: Delete a reservation (leases.write)
      responses:
        "204": { description: Deleted }

  /dhcp/leases:
    get:
      summary: Leases (offered, bound, declined; expired/released of the last 24 h with all=true)
      parameters:
        - { name: scope, in: query, schema: { type: string } }
        - { name: vlan, in: query, schema: { type: integer }, description: "VLAN ID" }
        - { name: state, in: query, schema: { type: string, enum: [offered, bound, released, expired, declined] } }
        - { name: q, in: query, schema: { type: string }, description: "Search IP, MAC, hostname, circuit-id" }
        - { name: all, in: query, schema: { type: boolean }, description: "Include released/expired" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Lease" } }
  /dhcp/leases/{scope}/{ip}:
    parameters:
      - { name: scope, in: path, required: true, schema: { type: string } }
      - { name: ip, in: path, required: true, schema: { type: string } }
    delete:
      summary: Release a lease now (leases.write). The client gets a NAK at its next renewal.
      responses:
        "204": { description: Released }
  /dhcp/leases/{scope}/{ip}/reserve:
    parameters:
      - { name: scope, in: path, required: true, schema: { type: string } }
      - { name: ip, in: path, required: true, schema: { type: string } }
    post:
      summary: Turn a lease into a reservation (leases.write)
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }

  /import/technitium:
    post:
      summary: Import zones, forwarders and DHCP scopes from a Technitium DNS Server (admin, step-up required)
      description: |
        Reads the old server through its HTTP API. Use dryRun=true first to see what would be imported.
        Existing objects with the same name are never overwritten (action "skip").
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TechnitiumImportInput" }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }

  /cluster:
    get:
      summary: Cluster state (enabled=false on a single node)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterView" }
  /cluster/settings:
    get:
      summary: Cluster settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterSettings" }
    put:
      summary: Update cluster settings (admin, step-up, on the primary)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterSettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterSettings" }
  /cluster/resync:
    post:
      summary: Force a full resynchronization (on a secondary itself; from the primary, of its secondaries) (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterView" }
  /cluster/failback:
    post:
      summary: Give the primary role back to the up-to-date secondary (admin, step-up, on the primary)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterView" }
  /cluster/promote:
    post:
      summary: Force this node to become primary (no witness, or other node known down) (admin, step-up)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterView" }
  /cluster/conflicts:
    get:
      summary: Changes made on this node while it was primary that were never replicated (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Conflict" } }
  /cluster/conflicts/{id}/reapply:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Apply the lost change on the primary (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterView" }
  /cluster/conflicts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Ignore a conflict (admin)
      responses:
        "204": { description: Ignored }

  /settings/modules:
    get:
      summary: Optional modules state (any role)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Modules" }
    put:
      summary: Turn modules on/off without restart (admin, step-up, replicated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Modules" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Modules" }

  /blocking/status:
    get:
      summary: Blocking state and statistics (this node)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockingStatus" }
  /blocking/settings:
    get:
      summary: Blocking settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockingSettings" }
    put:
      summary: Update blocking settings (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockingSettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockingSettings" }
  /blocking/pause:
    post:
      summary: Pause blocking for N minutes (0 = resume now) (records.write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 0, maximum: 1440 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockingStatus" }
  /blocking/refresh:
    post:
      summary: Download all enabled lists now (on this node; the other node refreshes on its own schedule) (records.write)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BlockList" } }
  /blocking/check:
    post:
      summary: Tell whether a name is blocked, and why (any role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                client: { type: string, description: "Client IP (policy check), default: no policy" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked: { type: boolean }
                  reason: { type: string, description: "e.g. liste « OISD », règle manuelle, liste blanche" }
                  matched: { type: string, description: "Domain of the list entry that matched" }
                  policyActive: { type: boolean, description: "Blocking applies to this client" }
  /blocking/lists:
    get:
      summary: Subscribed lists
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BlockList" } }
    post:
      summary: Subscribe to a list (config.write). It is downloaded at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockListInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockList" }
  /blocking/lists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Update a list (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockListInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockList" }
    delete:
      summary: Remove a list (config.write)
      responses:
        "204": { description: Deleted }
  /blocking/rules:
    get:
      summary: Manual blacklist and whitelist
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [allow, deny] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BlockRule" } }
    post:
      summary: Add a domain to the blacklist or whitelist (records.write). The whitelist wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, kind]
              properties:
                domain: { type: string, description: "Blocks/allows the domain and its sub-domains" }
                kind: { type: string, enum: [allow, deny] }
                comment: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockRule" }
  /blocking/rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Remove a manual rule (records.write)
      responses:
        "204": { description: Deleted }
  /blocking/policies:
    get:
      summary: Where blocking applies (interface, VLAN, client network)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BlockPolicy" } }
    post:
      summary: Add a policy (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockPolicyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockPolicy" }
  /blocking/policies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Update a policy (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockPolicyInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockPolicy" }
    delete:
      summary: Remove a policy (config.write)
      responses:
        "204": { description: Deleted }

  /dnssec/zones:
    get:
      summary: DNSSEC state of every primary zone
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DnssecZone" } }
  /dnssec/zones/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: DNSSEC details of a zone (keys without private parts, DS records)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnssecZone" }
  /dnssec/zones/{id}/enable:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Sign the zone (config.write). Keys are created once and replicated (encrypted) to the other node.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithm: { type: integer, enum: [13, 15], default: 13, description: "13 = ECDSA P-256, 15 = Ed25519" }
                nsecMode: { type: string, enum: [nsec, nsec3], default: nsec3 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnssecZone" }
  /dnssec/zones/{id}/disable:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Stop signing (config.write, step-up). Remove the DS at the registrar first!
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnssecZone" }
  /dnssec/zones/{id}/rollover:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Start a key rollover now (config.write). ZSK rollovers are also automatic; a KSK rollover needs the new DS at the registrar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [zsk, ksk] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnssecZone" }
  /dnssec/zones/{id}/ds-published:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Confirm the new DS is published at the registrar (config.write); ends a KSK rollover
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnssecZone" }
  /dnssec/zones/{id}/export:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Export the private keys in BIND format (admin, step-up)
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string }

  /dashboard:
    get:
      summary: Dashboard of this node (any role)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /events:
    get:
      summary: Server-sent events (text/event-stream). Event "dashboard" every 2 s (Dashboard JSON), "leases" when DHCP leases change (no body), "ping" every 15 s.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }

  /logs/dns:
    get:
      summary: DNS query log of this node, newest first
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Part of the name" }
        - { name: client, in: query, schema: { type: string }, description: "Client IP or network (CIDR)" }
        - { name: type, in: query, schema: { type: string }, description: "A, AAAA, MX..." }
        - { name: rcode, in: query, schema: { type: string }, description: "NOERROR, NXDOMAIN, SERVFAIL, REFUSED" }
        - { name: source, in: query, schema: { type: string, enum: [local, cache, forwarder, blocked, refused, error] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: before, in: query, schema: { type: integer }, description: "Cursor: id of the last item of the previous page" }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DnsLogEntry" } }
                  nextCursor: { type: [integer, "null"] }
  /logs/dhcp:
    get:
      summary: DHCP event log of this node, newest first
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Part of MAC, IP or hostname" }
        - { name: event, in: query, schema: { type: string, enum: [offer, ack, nak, release, decline, expire, ignored] } }
        - { name: scope, in: query, schema: { type: string }, description: "Scope id" }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: before, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DhcpLogEntry" } }
                  nextCursor: { type: [integer, "null"] }
  /logs/settings:
    get:
      summary: Log settings (replicated)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogSettings" }
    put:
      summary: Update log settings (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogSettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogSettings" }
  /logs/status:
    get:
      summary: Size and content of the log database of this node
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogStatus" }
  /logs/purge:
    post:
      summary: Empty the DNS and DHCP logs of this node (admin, step-up)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogStatus" }

  /backup:
    post:
      summary: Download the whole configuration as one YAML file (admin, step-up). Secrets stay encrypted; their key is encrypted with the password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 12 }
      responses:
        "200":
          description: The backup file (Content-Disposition attachment leazone-backup-YYYYMMDD-HHMM.yaml)
          content:
            application/yaml:
              schema: { type: string }
  /restore:
    post:
      summary: >-
        Replace the whole configuration with a backup (admin, step-up, primary only). Users, passkeys and TOTP come
        from the backup, but second factors that this node no longer has for an existing user (deleted passkeys,
        disabled or replaced TOTP, regenerated recovery codes) are not brought back. All sessions (including the
        caller's) and all API tokens are revoked. The backup must contain an active admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, content]
              properties:
                password: { type: string }
                content: { type: string, description: "The YAML file content (32 MB max)" }
                dryRun: { type: boolean, default: false, description: "Check the file and the password, write nothing" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreResult" }
  /backups:
    get:
      summary: Automatic daily backups kept in /data/backups (admin). Needs LEAZONE_BACKUP_PASSWORD_FILE.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, description: "A backup password is configured" }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        size: { type: integer }
                        createdAt: { type: string, format: date-time }
  /backups/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      summary: Download an automatic backup (admin, step-up)
      responses:
        "200":
          description: The file
          content:
            application/yaml:
              schema: { type: string }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-leazone_session
    token:
      type: http
      scheme: bearer

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        retryAfter: { type: integer }
        errors: { type: object, additionalProperties: { type: string } }

    Role:
      type: string
      enum: [admin, operator, readonly]

    SystemInfo:
      type: object
      properties:
        product: { type: string, example: Leazone }
        version: { type: string }
        rpId: { type: string, description: "WebAuthn RP ID; empty when passkeys are unavailable (IP access)" }
        passkeysAvailable: { type: boolean }
        passkeysUnavailableReason: { type: string }
        selfSignedCertificate: { type: boolean, description: "Show the warning banner" }

    SessionState:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [anonymous, mfa_required, mfa_setup_required, authenticated]
          description: |
            anonymous: not logged in.
            mfa_required: password OK, a second factor is needed (see mfaMethods).
            mfa_setup_required: the user must enroll a MFA method (see allowedMfaMethods) before using the UI.
            authenticated: full access according to role.
        csrfToken: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            username: { type: string }
            role: { $ref: "#/components/schemas/Role" }
        mfaMethods:
          type: array
          description: Methods the user can use now for the second factor
          items: { type: string, enum: [passkey, totp, recovery] }
        allowedMfaMethods:
          type: array
          description: Methods the policy allows to enroll
          items: { type: string, enum: [passkey, totp] }
        expiresAt: { type: string, format: date-time }
        elevatedUntil: { type: [string, "null"], format: date-time }

    WebAuthnBegin:
      type: object
      properties:
        ceremonyId: { type: string }
        options:
          type: object
          description: "PublicKeyCredentialCreationOptionsJSON / RequestOptionsJSON wrapped as { publicKey: ... }"

    WebAuthnFinish:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId: { type: string }
        credential:
          type: object
          description: "PublicKeyCredential serialized as JSON (RegistrationResponseJSON / AuthenticationResponseJSON)"

    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }

    MfaEnrollResult:
      type: object
      properties:
        session: { $ref: "#/components/schemas/SessionState" }
        recoveryCodes: { type: [array, "null"], items: { type: string } }

    Me:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        totpEnabled: { type: boolean }
        passkeyCount: { type: integer }
        recoveryCodesRemaining: { type: integer }
        totpAllowed:
          type: boolean
          description: "The security policy accepts TOTP as a second factor (step-up, enrollment)."

    Passkey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        backupEligible: { type: boolean, description: "Synced passkey (password manager, iCloud...)" }

    Session:
      type: object
      properties:
        id: { type: string }
        current: { type: boolean }
        ip: { type: string }
        userAgent: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    ApiToken:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        scope: { type: string, enum: [read, write] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        mfaEnabled: { type: boolean }
        passkeyCount: { type: integer }
        totpEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, "null"], format: date-time }

    SecuritySettings:
      type: object
      properties:
        mfaRequiredFor: { type: string, enum: [all, admins] }
        mfaMethods: { type: string, enum: [passkey, passkey_or_totp] }
        sessionMaxHours: { type: integer, minimum: 1, maximum: 720 }
        sessionIdleMinutes: { type: integer, minimum: 5, maximum: 1440 }
        uiAllowedNetworks: { type: array, items: { type: string }, description: "CIDR list, empty = all" }
        webauthnRpId: { type: string, description: "Empty = host name of the public URL or of the request" }

    TlsInfo:
      type: object
      properties:
        source: { type: string, enum: [selfsigned, import, file] }
        subject: { type: string }
        dnsNames: { type: array, items: { type: string } }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        fingerprintSha256: { type: string }

    AuditEntry:
      type: object
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        actor: { type: string }
        ip: { type: string }
        action: { type: string, example: auth.login.success }
        target: { type: string }
        result: { type: string, enum: [success, failure] }
        details: { type: object }

    NetAddress:
      type: object
      properties:
        address: { type: string, example: 192.168.20.1 }
        prefixLength: { type: integer, example: 24 }
        network: { type: string, example: 192.168.20.0/24 }
        family: { type: string, enum: [ipv4, ipv6] }

    DnsListener:
      type: object
      properties:
        address: { type: string, example: "192.168.20.1:53" }
        protocol: { type: string, enum: [udp, tcp] }
        interface: { type: string }
        state: { type: string, enum: [listening, error] }
        error: { type: string, description: "Human readable (French), e.g. port already used" }

    NetInterface:
      type: object
      properties:
        name: { type: string, example: eth0.20 }
        index: { type: integer }
        type: { type: string, enum: [physical, vlan, bond, bridge, loopback, virtual, other] }
        parent: { type: [string, "null"], example: eth0 }
        vlanId: { type: [integer, "null"], example: 20 }
        mac: { type: string }
        mtu: { type: integer }
        up: { type: boolean }
        present: { type: boolean, description: "false: settings exist but the interface is gone from the host" }
        addresses: { type: array, items: { $ref: "#/components/schemas/NetAddress" } }
        dnsEnabled: { type: boolean }
        dhcpEnabled: { type: boolean }
        dnsListeners: { type: array, items: { $ref: "#/components/schemas/DnsListener" } }

    DnsSettings:
      type: object
      properties:
        cacheSize: { type: integer, minimum: 0, maximum: 1000000, description: "Max entries, 0 disables the cache" }
        cacheMinTtl: { type: integer, minimum: 0, maximum: 86400 }
        cacheMaxTtl: { type: integer, minimum: 1, maximum: 604800 }
        cacheNegativeMaxTtl: { type: integer, minimum: 0, maximum: 86400 }
        recursionNetworks: { type: array, items: { type: string }, description: "CIDR allowed to use recursion (forwarders). Local zones answer everyone." }
        extraListenAddresses: { type: array, items: { type: string }, description: "Extra IPs to listen on (e.g. 127.0.0.1). The unspecified addresses 0.0.0.0 and :: are refused." }

    DnsStatus:
      type: object
      properties:
        port: { type: integer }
        listeners: { type: array, items: { $ref: "#/components/schemas/DnsListener" } }
        cache:
          type: object
          properties:
            entries: { type: integer }
            hits: { type: integer }
            misses: { type: integer }
        forwarders:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              healthy: { type: boolean }
              lastError: { type: string }
              lastLatencyMs: { type: number }

    LookupResult:
      type: object
      properties:
        rcode: { type: string, example: NOERROR }
        source: { type: string, enum: [local, cache, forwarder, blocked, refused, error] }
        forwarder: { type: string }
        latencyMs: { type: number }
        answers: { type: array, items: { type: string }, description: "Records in presentation format" }
        authority: { type: array, items: { type: string } }

    Soa:
      type: object
      properties:
        primaryNs: { type: string, example: ns1.maison.lan. }
        adminEmail: { type: string, example: admin@maison.lan }
        refresh: { type: integer, default: 3600 }
        retry: { type: integer, default: 600 }
        expire: { type: integer, default: 604800 }
        minimum: { type: integer, default: 300, description: "Negative caching TTL" }

    Zone:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: maison.lan }
        kind: { type: string, enum: [primary, reverse] }
        auto: { type: boolean, description: "Created from a DHCP scope (phase 3)" }
        ttl: { type: integer, description: "Default TTL of records" }
        soa: { $ref: "#/components/schemas/Soa" }
        serial: { type: integer }
        recordCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ZoneInput:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "maison.lan, 20.168.192.in-addr.arpa or 192.168.20.0/24" }
        ttl: { type: integer, default: 3600 }
        soa: { $ref: "#/components/schemas/Soa" }

    RecordType:
      type: string
      enum: [A, AAAA, CNAME, MX, TXT, SRV, PTR, NS]

    Record:
      type: object
      properties:
        id: { type: string }
        name: { type: string, description: "Relative to the zone, @ for the apex", example: www }
        fqdn: { type: string, example: www.maison.lan. }
        type: { $ref: "#/components/schemas/RecordType" }
        ttl: { type: [integer, "null"], description: "null = zone default" }
        data: { $ref: "#/components/schemas/RecordData" }
        value: { type: string, description: "Data in presentation format, e.g. '10 mail.maison.lan.'" }
        source: { type: string, enum: [manual, dhcp] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RecordInput:
      type: object
      required: [name, type, data]
      properties:
        name: { type: string, description: "@, www, or a FQDN ending with the zone name" }
        type: { $ref: "#/components/schemas/RecordType" }
        ttl: { type: [integer, "null"] }
        data: { $ref: "#/components/schemas/RecordData" }

    RecordData:
      type: object
      description: |
        Fields depend on the type:
          A / AAAA: { ip }
          CNAME / PTR: { target }
          NS: { host }
          MX: { preference, exchange }
          TXT: { text }  (long text is split in 255-byte strings automatically)
          SRV: { priority, weight, port, target }
        Host names may be relative to the zone (mail) or absolute (mail.maison.lan.).
      properties:
        ip: { type: string }
        target: { type: string }
        host: { type: string }
        preference: { type: integer }
        exchange: { type: string }
        text: { type: string }
        priority: { type: integer }
        weight: { type: integer }
        port: { type: integer }

    ForwarderProtocol:
      type: string
      enum: [udp, tcp, dot, doh]

    ForwarderInput:
      type: object
      required: [protocol]
      properties:
        domain: { type: string, description: "Empty = global forwarder; otherwise conditional for this domain and its sub-domains" }
        protocol: { $ref: "#/components/schemas/ForwarderProtocol" }
        address: { type: string, description: "IP address (required for udp/tcp/dot; for doh: bootstrap IP, optional if the URL host is an IP)" }
        port: { type: integer, description: "Default 53 (udp/tcp), 853 (dot), 443 (doh)" }
        tlsServerName: { type: string, description: "Name checked in the certificate (dot), e.g. dns.quad9.net" }
        tlsVerify: { type: boolean, default: true }
        dohUrl: { type: string, example: "https://dns.quad9.net/dns-query" }
        enabled: { type: boolean, default: true }
        position: { type: integer, description: "Order inside its group (0 = first)" }

    Forwarder:
      allOf:
        - $ref: "#/components/schemas/ForwarderInput"
        - type: object
          properties:
            id: { type: string }
            health:
              type: object
              properties:
                healthy: { type: boolean }
                lastError: { type: string }
                lastLatencyMs: { type: number }
                lastCheckAt: { type: [string, "null"], format: date-time }

    ForwarderTest:
      type: object
      properties:
        ok: { type: boolean }
        latencyMs: { type: number }
        rcode: { type: string }
        answers: { type: array, items: { type: string } }
        error: { type: string, description: "French message, e.g. certificat invalide" }

    Vlan:
      type: object
      properties:
        id: { type: string }
        vlanId: { type: integer, minimum: 1, maximum: 4094 }
        name: { type: string, example: Invités }

    VlanInput:
      type: object
      required: [vlanId, name]
      properties:
        vlanId: { type: integer, minimum: 1, maximum: 4094 }
        name: { type: string, maxLength: 64 }

    ScopeUsage:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        network: { type: string }
        mode: { type: string, enum: [direct, relay, both, none] }
        enabled: { type: boolean }
        size: { type: integer, description: "Addresses in the range minus exclusions" }
        used: { type: integer, description: "Bound + offered + declined + reserved" }
        activeLeases: { type: integer }
        percent: { type: number }
        alert: { type: boolean, description: "percent >= alertThreshold" }
        alertThreshold: { type: integer }

    VlanOverview:
      type: object
      properties:
        id: { type: [string, "null"], description: "null when the VLAN is only detected on the host" }
        vlanId: { type: integer }
        name: { type: string, description: "Label, empty if none" }
        interfaces:
          type: array
          description: Host interfaces carrying this VLAN
          items:
            type: object
            properties:
              name: { type: string }
              parent: { type: string }
              addresses: { type: array, items: { type: string }, description: "CIDR" }
              dhcpEnabled: { type: boolean }
        scopes: { type: array, items: { $ref: "#/components/schemas/ScopeUsage" } }

    DhcpStatus:
      type: object
      properties:
        listening: { type: boolean }
        error: { type: string }
        port: { type: integer }
        interfaces: { type: array, items: { type: string }, description: "Interfaces with DHCP enabled" }
        pingAvailable: { type: boolean, description: "false: ping before lease cannot work (NET_RAW missing)" }

    DhcpOption:
      type: object
      required: [code, type, value]
      properties:
        code: { type: integer, minimum: 1, maximum: 254 }
        type: { type: string, enum: [ip, ips, string, u8, u16, u32, bool, hex] }
        value: { type: string, description: "ips: comma separated; bool: true/false; hex: e.g. 01:02:0a" }

    IpRange:
      type: object
      required: [start, end]
      properties:
        start: { type: string }
        end: { type: string }

    ScopeInput:
      type: object
      required: [name, network, rangeStart, rangeEnd]
      properties:
        name: { type: string, example: "20 - Invités" }
        vlanId: { type: [integer, "null"], description: "VLAN ID (1-4094); a label is created if missing" }
        enabled: { type: boolean, default: true }
        network: { type: string, example: 192.168.20.0/24 }
        rangeStart: { type: string, example: 192.168.20.100 }
        rangeEnd: { type: string, example: 192.168.20.199 }
        exclusions: { type: array, items: { $ref: "#/components/schemas/IpRange" } }
        leaseTime: { type: integer, description: "Seconds (default 86400)" }
        gateway: { type: string }
        dnsServers: { type: array, items: { type: string } }
        domain: { type: string, description: "Option 15 (domain name sent to clients)" }
        ntpServers: { type: array, items: { type: string } }
        options: { type: array, items: { $ref: "#/components/schemas/DhcpOption" } }
        interface: { type: [string, "null"], description: "Direct mode: host interface in this network (e.g. eno1.20)" }
        relay: { type: boolean, description: "Relay mode: accept requests relayed with a giaddr in this network" }
        relayAgents: { type: array, items: { type: string }, description: "Trusted relays: giaddr outside the network, or UDP source address of a relay that does not send from giaddr. Link selection (82.5) and subnet selection (118) are honored only for these relays." }
        ddnsEnabled: { type: boolean, default: true }
        ddnsDomain: { type: string, description: "Zone for automatic A records, e.g. invites.lan (created if missing)" }
        pingCheck: { type: boolean, default: false }
        alertThreshold: { type: integer, default: 80 }

    Scope:
      allOf:
        - $ref: "#/components/schemas/ScopeInput"
        - type: object
          properties:
            id: { type: string }
            vlanName: { type: string }
            mode: { type: string, enum: [direct, relay, both, none] }
            usage: { $ref: "#/components/schemas/ScopeUsage" }
            reverseZones: { type: array, items: { type: string } }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    ReservationInput:
      type: object
      required: [scopeId, ip]
      properties:
        scopeId: { type: string }
        mac: { type: string, description: "aa:bb:cc:dd:ee:ff (mac or clientId required)" }
        clientId: { type: string, description: "Option 61 in hex, e.g. 01:aa:bb:cc:dd:ee:ff" }
        ip: { type: string }
        hostname: { type: string }
        description: { type: string }

    Reservation:
      allOf:
        - $ref: "#/components/schemas/ReservationInput"
        - type: object
          properties:
            id: { type: string }
            scopeName: { type: string }
            createdAt: { type: string, format: date-time }

    Lease:
      type: object
      properties:
        scopeId: { type: string }
        scopeName: { type: string }
        vlanId: { type: [integer, "null"] }
        ip: { type: string }
        mac: { type: string }
        clientId: { type: string }
        hostname: { type: string }
        state: { type: string, enum: [offered, bound, released, expired, declined] }
        starts: { type: string, format: date-time }
        ends: { type: string, format: date-time }
        circuitId: { type: string, description: "Option 82.1, printable or hex" }
        remoteId: { type: string, description: "Option 82.2, printable or hex" }
        giaddr: { type: string, description: "Relay address, empty in direct mode" }
        reserved: { type: boolean }
        dnsName: { type: [string, "null"], description: "FQDN registered in DNS" }

    TechnitiumImportInput:
      type: object
      required: [url]
      properties:
        url: { type: string, example: "http://10.0.0.5:5380" }
        token: { type: string, description: "API token (preferred)" }
        username: { type: string }
        password: { type: string }
        tlsVerify: { type: boolean, default: true }
        dryRun: { type: boolean, default: true }
        zones: { type: boolean, default: true }
        forwarders: { type: boolean, default: true }
        dhcp: { type: boolean, default: true }

    ImportItem:
      type: object
      properties:
        kind: { type: string, enum: [zone, forwarder, scope, reservation] }
        name: { type: string }
        action: { type: string, enum: [create, skip, error] }
        detail: { type: string }

    ImportReport:
      type: object
      properties:
        dryRun: { type: boolean }
        source: { type: string, description: "Technitium version" }
        items: { type: array, items: { $ref: "#/components/schemas/ImportItem" } }
        created: { type: integer }
        skipped: { type: integer }
        errors: { type: integer }

    ClusterSettings:
      type: object
      properties:
        heartbeatMs: { type: integer, minimum: 100, maximum: 10000, default: 1000 }
        failCount: { type: integer, minimum: 2, maximum: 20, default: 3 }
        leaseMs: { type: integer, minimum: 2000, maximum: 60000, default: 6000 }
        failbackMode: { type: string, enum: [auto, manual], default: auto }
        failbackDelaySec: { type: integer, minimum: 0, maximum: 86400, default: 300 }
        dhcpMode: { type: string, enum: [load-balancing, active-passive], default: load-balancing }

    ClusterRole:
      type: string
      enum: [standalone, joining, secondary, primary, isolated, incompatible, offline]

    ClusterNode:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        addr: { type: string }
        self: { type: boolean }
        online: { type: boolean }
        role: { $ref: "#/components/schemas/ClusterRole" }
        preferredRole: { type: string, enum: [primary, secondary] }
        latencyMs: { type: number }
        lastSeen: { type: [string, "null"], format: date-time }
        lastSync: { type: [string, "null"], format: date-time }
        epoch: { type: integer }
        seq: { type: integer, description: "Config version (journal position)" }
        configHash: { type: string }
        version: { type: string, description: "Leazone version" }
        partnerDown: { type: boolean, description: "Primary serving all DHCP clients (partner confirmed down)" }
        error: { type: string }

    ClusterView:
      type: object
      properties:
        enabled: { type: boolean }
        role: { $ref: "#/components/schemas/ClusterRole" }
        epoch: { type: integer }
        seq: { type: integer }
        primaryUrl: { type: string }
        writable: { type: boolean }
        readOnlyReason: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/ClusterNode" } }
        witness:
          type: object
          properties:
            mode: { type: string, enum: [container, ping, none] }
            address: { type: string }
            reachable: { type: boolean }
            lastOk: { type: [string, "null"], format: date-time }
            error: { type: string }
            epoch: { type: integer }
            primary: { type: string }
        gaps:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [config, vlan, version, sync] }
              detail: { type: string }
        conflicts: { type: integer, description: "Pending conflicts on this node" }
        history:
          type: array
          description: Primary terms, newest first (failovers and returns)
          items:
            type: object
            properties:
              epoch: { type: integer }
              startSeq: { type: integer }
              nodeId: { type: string }
              name: { type: string }
              at: { type: string, format: date-time }
              reason: { type: string }
        settings: { $ref: "#/components/schemas/ClusterSettings" }
        vip:
          type: [object, "null"]
          properties:
            address: { type: string }
            interface: { type: string }
            heldHere: { type: boolean }
            error: { type: string }

    Conflict:
      type: object
      properties:
        id: { type: string }
        epoch: { type: integer }
        seq: { type: integer }
        table: { type: string }
        pk: { type: string }
        op: { type: string, enum: [upsert, delete] }
        row: { type: string, description: "Row as JSON" }
        detectedAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, reapplied, dismissed] }

    Modules:
      type: object
      properties:
        blocking: { type: boolean, default: false }
        dnssec: { type: boolean, default: false, description: "Zone signing" }
        dnssecValidation: { type: boolean, default: false, description: "Validate answers from forwarders (AD bit, SERVFAIL when bogus)" }

    BlockingSettings:
      type: object
      properties:
        responseMode: { type: string, enum: [nxdomain, null-ip], default: nxdomain, description: "null-ip = 0.0.0.0 / ::" }
        refreshHours: { type: integer, minimum: 1, maximum: 168, default: 24 }
        defaultEnabled: { type: boolean, default: true, description: "Applies where no policy matches" }

    BlockingStatus:
      type: object
      properties:
        enabled: { type: boolean, description: "Module on" }
        paused: { type: boolean }
        pausedUntil: { type: [string, "null"], format: date-time }
        domains: { type: integer, description: "Blocked domains loaded (lists + manual)" }
        lists: { type: integer }
        queries: { type: integer, description: "Queries checked since start (this node)" }
        blocked: { type: integer }
        percent: { type: number }
        top:
          type: array
          items:
            type: object
            properties:
              domain: { type: string }
              count: { type: integer }

    BlockListInput:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string, description: "http(s) URL" }
        format: { type: string, enum: [auto, hosts, domains, adblock], default: auto }
        enabled: { type: boolean, default: true }

    BlockList:
      allOf:
        - $ref: "#/components/schemas/BlockListInput"
        - type: object
          properties:
            id: { type: string }
            fetchedAt: { type: [string, "null"], format: date-time }
            entries: { type: integer }
            error: { type: string }

    BlockRule:
      type: object
      properties:
        id: { type: string }
        domain: { type: string }
        kind: { type: string, enum: [allow, deny] }
        comment: { type: string }
        createdAt: { type: string, format: date-time }

    BlockPolicyInput:
      type: object
      required: [targetKind, target, enabled]
      properties:
        targetKind: { type: string, enum: [interface, vlan, network] }
        target: { type: string, description: "eno1.20, 20, or 192.168.20.0/24" }
        enabled: { type: boolean, description: "true: blocking on for this target, false: off" }
        comment: { type: string }

    BlockPolicy:
      allOf:
        - $ref: "#/components/schemas/BlockPolicyInput"
        - type: object
          properties:
            id: { type: string }

    DnssecKey:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [ksk, zsk] }
        algorithm: { type: integer }
        keyTag: { type: integer }
        state: { type: string, enum: [published, active, retired, ds-pending], description: "published = announced, not signing yet" }
        createdAt: { type: string, format: date-time }
        activeAt: { type: [string, "null"], format: date-time }
        retireAt: { type: [string, "null"], format: date-time }
        dnskey: { type: string, description: "DNSKEY record" }

    DnssecZone:
      type: object
      properties:
        zoneId: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        algorithm: { type: integer }
        nsecMode: { type: string, enum: [nsec, nsec3] }
        keys: { type: array, items: { $ref: "#/components/schemas/DnssecKey" } }
        ds: { type: array, items: { type: string }, description: "DS records to give to the registrar (SHA-256)" }
        dsPending: { type: boolean, description: "A KSK rollover waits for the new DS at the registrar" }
        nextZskRollover: { type: [string, "null"], format: date-time }

    Dashboard:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        node: { type: string }
        uptimeSeconds: { type: integer }
        dns:
          type: object
          properties:
            qps: { type: number, description: "Queries per second over the last minute" }
            queries24h: { type: integer }
            cacheHitRate: { type: number, description: "0..100, over the last hour" }
            blocked24h: { type: integer }
            failed24h: { type: integer }
            series:
              type: array
              description: "Last hour, one point per minute (oldest first)"
              items:
                type: object
                properties:
                  t: { type: string, format: date-time }
                  queries: { type: integer }
                  cached: { type: integer }
                  blocked: { type: integer }
            topDomains: { type: array, items: { $ref: "#/components/schemas/TopCount" } }
            topClients: { type: array, items: { $ref: "#/components/schemas/TopCount" } }
            topBlocked: { type: array, items: { $ref: "#/components/schemas/TopCount" } }
        dhcp:
          type: object
          properties:
            activeLeases: { type: integer }
            scopes:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  network: { type: string }
                  vlanId: { type: [integer, "null"] }
                  size: { type: integer }
                  used: { type: integer }
                  percent: { type: number }
                  alertThreshold: { type: integer, description: "Alert level of the scope (percent, 80 by default)" }
                  alert: { type: boolean, description: "percent >= alertThreshold" }
        ha:
          type: [object, "null"]
          description: "null on a single node"
          properties:
            role: { type: string }
            peerOnline: { type: boolean }
            witnessReachable: { type: boolean }
            gaps: { type: integer }
        blocking:
          type: [object, "null"]
          description: "null when the module is off"
          properties:
            percent: { type: number }
            blocked: { type: integer }
            queries: { type: integer }
            paused: { type: boolean }

    TopCount:
      type: object
      properties:
        name: { type: string }
        count: { type: integer }

    DnsLogEntry:
      type: object
      properties:
        id: { type: integer }
        time: { type: string, format: date-time }
        client: { type: string }
        name: { type: string }
        type: { type: string }
        rcode: { type: string }
        source: { type: string, enum: [local, cache, forwarder, blocked, refused, error] }
        latencyMs: { type: number }
        answer: { type: string, description: "First answer (short), if any" }

    DhcpLogEntry:
      type: object
      properties:
        id: { type: integer }
        time: { type: string, format: date-time }
        event: { type: string, enum: [offer, ack, nak, release, decline, expire, ignored] }
        mac: { type: string }
        ip: { type: string }
        hostname: { type: string }
        scopeId: { type: string }
        scopeName: { type: string }
        interface: { type: string }
        relay: { type: string, description: "Relay agent address (giaddr), empty when direct" }
        detail: { type: string, description: "e.g. reason of a NAK" }

    LogSettings:
      type: object
      properties:
        dnsQueries: { type: boolean, default: true }
        dhcpEvents: { type: boolean, default: true }
        retentionDays: { type: integer, minimum: 1, maximum: 365, default: 7 }
        maxSizeMb: { type: integer, minimum: 10, maximum: 100000, default: 500 }

    LogStatus:
      type: object
      properties:
        dnsEntries: { type: integer }
        dhcpEntries: { type: integer }
        sizeBytes: { type: integer }
        oldest: { type: [string, "null"], format: date-time }
        dropped: { type: integer, description: "Entries not written (too many at once) since start" }

    RestoreResult:
      type: object
      properties:
        dryRun: { type: boolean }
        createdAt: { type: string, format: date-time, description: "When the backup was made" }
        version: { type: string, description: "Leazone version that made it" }
        node: { type: string }
        tables: { type: object, additionalProperties: { type: integer }, description: "Rows per table" }
        users:
          type: array
          description: >
            Accounts not restored as they are in the backup (backup of this installation only): deleted here since
            the backup (restored disabled, API tokens revoked), or local values kept because more recent or more
            restrictive.
          items:
            type: object
            properties:
              id: { type: string }
              username: { type: string }
              disabled: { type: boolean, description: "Deleted since the backup: restored disabled, without API tokens" }
              kept: { type: array, items: { type: string, enum: [password, disabled, role] } }
