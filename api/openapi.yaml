openapi: 3.1.0
info:
  title: Leazone API
  version: 1.0.0
  description: |
    REST JSON API of Leazone (DNS + DHCP with high availability).

    Authentication:
      - Browser: session cookie `__Host-leazone_session` + header `X-CSRF-Token`
        (value from `GET /auth/session`) on every non-GET request.
      - Scripts: `Authorization: Bearer lz_<prefix>_<secret>` (API tokens, no CSRF).

    Errors use RFC 9457 `application/problem+json`. The `type` field is stable:
      - `urn:leazone:unauthenticated` (401)
      - `urn:leazone:forbidden` (403)
      - `urn:leazone:step-up-required` (403) -> re-verify with passkey/TOTP, see /auth/step-up/*
      - `urn:leazone:mfa-required` (403) -> session is not fully authenticated
      - `urn:leazone:rate-limited` (429) -> `retryAfter` seconds
      - `urn:leazone:validation` (422) -> `errors` map field -> message
      - `urn:leazone:not-found` (404), `urn:leazone:conflict` (409)
      - `urn:leazone:csrf` (403)
servers:
  - url: /api/v1
security:
  - session: []
  - token: []

paths:
  /system/info:
    get:
      summary: Public information used by the login page
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }

  /auth/session:
    get:
      summary: Current session state (also returns the CSRF token)
      security: []
      responses:
        "200":
          description: OK (state "anonymous" when not logged in)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }

  /auth/login:
    post:
      summary: Password login (first factor)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Session created. Check `state` for the next step.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /auth/logout:
    post:
      summary: Logout (revoke current session)
      responses:
        "204": { description: Logged out }

  /auth/passkey/begin:
    post:
      summary: Start a passwordless passkey login (discoverable credential)
      security: []
      responses:
        "200":
          description: WebAuthn request options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnBegin" }
  /auth/passkey/finish:
    post:
      summary: Finish a passwordless passkey login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnFinish" }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/mfa/passkey/begin:
    post:
      summary: Start passkey verification as second factor (state mfa_required)
      responses:
        "200":
          description: WebAuthn request options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnBegin" }
  /auth/mfa/passkey/finish:
    post:
      summary: Finish passkey second factor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnFinish" }
      responses:
        "200":
          description: Session upgraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
  /auth/mfa/totp:
    post:
      summary: TOTP second factor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Session upgraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/mfa/recovery:
    post:
      summary: Recovery code as second factor (single use)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Session upgraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }

  /auth/step-up/passkey/begin:
    post:
      summary: Start a step-up (re-verification before a sensitive action)
      responses:
        "200":
          description: WebAuthn request options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnBegin" }
  /auth/step-up/passkey/finish:
    post:
      summary: Finish passkey step-up
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnFinish" }
      responses:
        "200":
          description: Session elevated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
  /auth/step-up/totp:
    post:
      summary: TOTP step-up
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Session elevated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }

  /me:
    get:
      summary: Current user profile and MFA status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
  /me/password:
    post:
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        "204": { description: Changed }

  /me/passkeys:
    get:
      summary: List own passkeys
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Passkey" } }
  /me/passkeys/begin:
    post:
      summary: Start passkey registration
      responses:
        "200":
          description: WebAuthn creation options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnBegin" }
  /me/passkeys/finish:
    post:
      summary: Finish passkey registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebAuthnFinish"
                - type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Registered. `recoveryCodes` is set only when this is the first MFA method.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrollResult" }
  /me/passkeys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Rename a passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
    delete:
      summary: Delete a passkey (step-up required)
      responses:
        "204": { description: Deleted }

  /me/totp:
    get:
      summary: TOTP status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
    delete:
      summary: Disable TOTP (step-up required)
      responses:
        "204": { description: Disabled }
  /me/totp/setup:
    post:
      summary: Generate a new TOTP secret (not active until confirmed)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauthUrl: { type: string }
                  qrPng: { type: string, description: "data:image/png;base64,..." }
  /me/totp/confirm:
    post:
      summary: Confirm the TOTP secret with a code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Enabled. `recoveryCodes` is set only when this is the first MFA method.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrollResult" }

  /me/recovery-codes:
    get:
      summary: Number of unused recovery codes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  remaining: { type: integer }
    post:
      summary: Regenerate the 10 recovery codes (step-up required). Old ones stop working.
      responses:
        "200":
          description: New codes, shown only once
          content:
            application/json:
              schema:
                type: object
                properties:
                  codes: { type: array, items: { type: string } }

  /me/sessions:
    get:
      summary: List own active sessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Session" } }
  /me/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Revoke one of own sessions
      responses:
        "204": { description: Revoked }

  /me/tokens:
    get:
      summary: List own API tokens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
    post:
      summary: Create an API token (secret returned once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name: { type: string, maxLength: 64 }
                scope: { type: string, enum: [read, write] }
                expiresAt: { type: [string, "null"], format: date-time }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  item: { $ref: "#/components/schemas/ApiToken" }
  /me/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Revoke an API token
      responses:
        "204": { description: Revoked }

  /users:
    get:
      summary: List users (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      summary: Create a user (admin). If password is empty, a temporary one is generated and returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{1,31}$" }
                role: { $ref: "#/components/schemas/Role" }
                password: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/User" }
                  temporaryPassword: { type: [string, "null"] }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Update role or disable a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/Role" }
                disabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      summary: Delete a user (admin, step-up required)
      responses:
        "204": { description: Deleted }
  /users/{id}/reset-mfa:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Remove all MFA methods of a user (admin, step-up required). User must set up MFA again.
      responses:
        "204": { description: Done }
  /users/{id}/reset-password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Set a temporary password (admin, step-up required). Revokes the user's sessions.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  temporaryPassword: { type: string }

  /settings/security:
    get:
      summary: Security settings (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
    put:
      summary: Update security settings (admin, step-up required)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecuritySettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }

  /settings/tls:
    get:
      summary: Current HTTPS certificate (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TlsInfo" }
    post:
      summary: Import a certificate + private key in PEM (admin, step-up required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certPem, keyPem]
              properties:
                certPem: { type: string, description: "Leaf first, then intermediates" }
                keyPem: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TlsInfo" }

  /audit:
    get:
      summary: Audit log (admin), newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: "Search in actor, action, target" }
        - { name: action, in: query, schema: { type: string }, description: "Action prefix, e.g. auth." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  nextCursor: { type: [string, "null"] }

  /interfaces:
    get:
      summary: Network interfaces of the host (physical, VLAN, bond, bridge) with Leazone settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/NetInterface" } }
  /interfaces/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    patch:
      summary: Enable or disable DNS / DHCP on an interface (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dnsEnabled: { type: boolean }
                dhcpEnabled: { type: boolean, description: "Stored now, used from phase 3" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetInterface" }

  /dns/settings:
    get:
      summary: DNS server settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsSettings" }
    put:
      summary: Update DNS server settings (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DnsSettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsSettings" }
  /dns/status:
    get:
      summary: Listeners, cache and forwarder health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsStatus" }
  /dns/cache/flush:
    post:
      summary: Empty the cache, or only the entries of one name and its sub-names (records.write)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: "Empty = whole cache" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: integer }
  /dns/lookup:
    post:
      summary: Resolve a name like a client would (test tool)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, example: A }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupResult" }

  /dns/zones:
    get:
      summary: List zones
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Zone" } }
    post:
      summary: Create a zone (config.write). For a reverse zone, `name` may be a network like 192.168.1.0/24.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
  /dns/zones/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: One zone
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
    patch:
      summary: Update default TTL / SOA (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl: { type: integer }
                soa: { $ref: "#/components/schemas/Soa" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
    delete:
      summary: Delete a zone and its records (config.write, step-up required)
      responses:
        "204": { description: Deleted }
  /dns/zones/{id}/export:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Zone in BIND (RFC 1035) format
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string }
  /dns/zones/{id}/import:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Import records from a BIND zone file (records.write). SOA lines are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                replace: { type: boolean, description: "Delete existing records first", default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  skipped: { type: integer }
                  errors: { type: array, items: { type: string } }
  /dns/zones/{id}/records:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Records of a zone
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Record" } }
    post:
      summary: Add a record (records.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
  /dns/zones/{id}/records/{rid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: rid, in: path, required: true, schema: { type: string } }
    put:
      summary: Replace a record (records.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
    delete:
      summary: Delete a record (records.write)
      responses:
        "204": { description: Deleted }

  /dns/forwarders:
    get:
      summary: Global and conditional forwarders, ordered by domain then position
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Forwarder" } }
    post:
      summary: Add a forwarder (config.write). It is placed last in its group unless position is given.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForwarderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Forwarder" }
  /dns/forwarders/test:
    post:
      summary: Test a forwarder configuration without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForwarderInput" }
      responses:
        "200":
          description: Test result (ok=false on failure, never an HTTP error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForwarderTest" }
  /dns/forwarders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Replace a forwarder (config.write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForwarderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Forwarder" }
    delete:
      summary: Delete a forwarder (config.write)
      responses:
        "204": { description: Deleted }
  /dns/forwarders/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Test a saved forwarder
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForwarderTest" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-leazone_session
    token:
      type: http
      scheme: bearer

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        retryAfter: { type: integer }
        errors: { type: object, additionalProperties: { type: string } }

    Role:
      type: string
      enum: [admin, operator, readonly]

    SystemInfo:
      type: object
      properties:
        product: { type: string, example: Leazone }
        version: { type: string }
        rpId: { type: string, description: "WebAuthn RP ID; empty when passkeys are unavailable (IP access)" }
        passkeysAvailable: { type: boolean }
        passkeysUnavailableReason: { type: string }
        selfSignedCertificate: { type: boolean, description: "Show the warning banner" }

    SessionState:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [anonymous, mfa_required, mfa_setup_required, authenticated]
          description: |
            anonymous: not logged in.
            mfa_required: password OK, a second factor is needed (see mfaMethods).
            mfa_setup_required: the user must enroll a MFA method (see allowedMfaMethods) before using the UI.
            authenticated: full access according to role.
        csrfToken: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            username: { type: string }
            role: { $ref: "#/components/schemas/Role" }
        mfaMethods:
          type: array
          description: Methods the user can use now for the second factor
          items: { type: string, enum: [passkey, totp, recovery] }
        allowedMfaMethods:
          type: array
          description: Methods the policy allows to enroll
          items: { type: string, enum: [passkey, totp] }
        expiresAt: { type: string, format: date-time }
        elevatedUntil: { type: [string, "null"], format: date-time }

    WebAuthnBegin:
      type: object
      properties:
        ceremonyId: { type: string }
        options:
          type: object
          description: "PublicKeyCredentialCreationOptionsJSON / RequestOptionsJSON wrapped as { publicKey: ... }"

    WebAuthnFinish:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId: { type: string }
        credential:
          type: object
          description: "PublicKeyCredential serialized as JSON (RegistrationResponseJSON / AuthenticationResponseJSON)"

    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }

    MfaEnrollResult:
      type: object
      properties:
        session: { $ref: "#/components/schemas/SessionState" }
        recoveryCodes: { type: [array, "null"], items: { type: string } }

    Me:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        totpEnabled: { type: boolean }
        passkeyCount: { type: integer }
        recoveryCodesRemaining: { type: integer }

    Passkey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        backupEligible: { type: boolean, description: "Synced passkey (password manager, iCloud...)" }

    Session:
      type: object
      properties:
        id: { type: string }
        current: { type: boolean }
        ip: { type: string }
        userAgent: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    ApiToken:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        scope: { type: string, enum: [read, write] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        mfaEnabled: { type: boolean }
        passkeyCount: { type: integer }
        totpEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, "null"], format: date-time }

    SecuritySettings:
      type: object
      properties:
        mfaRequiredFor: { type: string, enum: [all, admins] }
        mfaMethods: { type: string, enum: [passkey, passkey_or_totp] }
        sessionMaxHours: { type: integer, minimum: 1, maximum: 720 }
        sessionIdleMinutes: { type: integer, minimum: 5, maximum: 1440 }
        uiAllowedNetworks: { type: array, items: { type: string }, description: "CIDR list, empty = all" }
        webauthnRpId: { type: string, description: "Empty = host name of the public URL or of the request" }

    TlsInfo:
      type: object
      properties:
        source: { type: string, enum: [selfsigned, import, file] }
        subject: { type: string }
        dnsNames: { type: array, items: { type: string } }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        fingerprintSha256: { type: string }

    AuditEntry:
      type: object
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        actor: { type: string }
        ip: { type: string }
        action: { type: string, example: auth.login.success }
        target: { type: string }
        result: { type: string, enum: [success, failure] }
        details: { type: object }

    NetAddress:
      type: object
      properties:
        address: { type: string, example: 192.168.20.1 }
        prefixLength: { type: integer, example: 24 }
        network: { type: string, example: 192.168.20.0/24 }
        family: { type: string, enum: [ipv4, ipv6] }

    DnsListener:
      type: object
      properties:
        address: { type: string, example: "192.168.20.1:53" }
        protocol: { type: string, enum: [udp, tcp] }
        interface: { type: string }
        state: { type: string, enum: [listening, error] }
        error: { type: string, description: "Human readable (French), e.g. port already used" }

    NetInterface:
      type: object
      properties:
        name: { type: string, example: eth0.20 }
        index: { type: integer }
        type: { type: string, enum: [physical, vlan, bond, bridge, loopback, virtual, other] }
        parent: { type: [string, "null"], example: eth0 }
        vlanId: { type: [integer, "null"], example: 20 }
        mac: { type: string }
        mtu: { type: integer }
        up: { type: boolean }
        present: { type: boolean, description: "false: settings exist but the interface is gone from the host" }
        addresses: { type: array, items: { $ref: "#/components/schemas/NetAddress" } }
        dnsEnabled: { type: boolean }
        dhcpEnabled: { type: boolean }
        dnsListeners: { type: array, items: { $ref: "#/components/schemas/DnsListener" } }

    DnsSettings:
      type: object
      properties:
        cacheSize: { type: integer, minimum: 0, maximum: 1000000, description: "Max entries, 0 disables the cache" }
        cacheMinTtl: { type: integer, minimum: 0, maximum: 86400 }
        cacheMaxTtl: { type: integer, minimum: 1, maximum: 604800 }
        cacheNegativeMaxTtl: { type: integer, minimum: 0, maximum: 86400 }
        recursionNetworks: { type: array, items: { type: string }, description: "CIDR allowed to use recursion (forwarders). Local zones answer everyone." }
        extraListenAddresses: { type: array, items: { type: string }, description: "Extra IPs to listen on (e.g. 127.0.0.1)" }

    DnsStatus:
      type: object
      properties:
        port: { type: integer }
        listeners: { type: array, items: { $ref: "#/components/schemas/DnsListener" } }
        cache:
          type: object
          properties:
            entries: { type: integer }
            hits: { type: integer }
            misses: { type: integer }
        forwarders:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              healthy: { type: boolean }
              lastError: { type: string }
              lastLatencyMs: { type: number }

    LookupResult:
      type: object
      properties:
        rcode: { type: string, example: NOERROR }
        source: { type: string, enum: [local, cache, forwarder, refused, error] }
        forwarder: { type: string }
        latencyMs: { type: number }
        answers: { type: array, items: { type: string }, description: "Records in presentation format" }
        authority: { type: array, items: { type: string } }

    Soa:
      type: object
      properties:
        primaryNs: { type: string, example: ns1.maison.lan. }
        adminEmail: { type: string, example: admin@maison.lan }
        refresh: { type: integer, default: 3600 }
        retry: { type: integer, default: 600 }
        expire: { type: integer, default: 604800 }
        minimum: { type: integer, default: 300, description: "Negative caching TTL" }

    Zone:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: maison.lan }
        kind: { type: string, enum: [primary, reverse] }
        auto: { type: boolean, description: "Created from a DHCP scope (phase 3)" }
        ttl: { type: integer, description: "Default TTL of records" }
        soa: { $ref: "#/components/schemas/Soa" }
        serial: { type: integer }
        recordCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ZoneInput:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "maison.lan, 20.168.192.in-addr.arpa or 192.168.20.0/24" }
        ttl: { type: integer, default: 3600 }
        soa: { $ref: "#/components/schemas/Soa" }

    RecordType:
      type: string
      enum: [A, AAAA, CNAME, MX, TXT, SRV, PTR, NS]

    Record:
      type: object
      properties:
        id: { type: string }
        name: { type: string, description: "Relative to the zone, @ for the apex", example: www }
        fqdn: { type: string, example: www.maison.lan. }
        type: { $ref: "#/components/schemas/RecordType" }
        ttl: { type: [integer, "null"], description: "null = zone default" }
        data: { $ref: "#/components/schemas/RecordData" }
        value: { type: string, description: "Data in presentation format, e.g. '10 mail.maison.lan.'" }
        source: { type: string, enum: [manual, dhcp] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RecordInput:
      type: object
      required: [name, type, data]
      properties:
        name: { type: string, description: "@, www, or a FQDN ending with the zone name" }
        type: { $ref: "#/components/schemas/RecordType" }
        ttl: { type: [integer, "null"] }
        data: { $ref: "#/components/schemas/RecordData" }

    RecordData:
      type: object
      description: |
        Fields depend on the type:
          A / AAAA: { ip }
          CNAME / PTR: { target }
          NS: { host }
          MX: { preference, exchange }
          TXT: { text }  (long text is split in 255-byte strings automatically)
          SRV: { priority, weight, port, target }
        Host names may be relative to the zone (mail) or absolute (mail.maison.lan.).
      properties:
        ip: { type: string }
        target: { type: string }
        host: { type: string }
        preference: { type: integer }
        exchange: { type: string }
        text: { type: string }
        priority: { type: integer }
        weight: { type: integer }
        port: { type: integer }

    ForwarderProtocol:
      type: string
      enum: [udp, tcp, dot, doh]

    ForwarderInput:
      type: object
      required: [protocol]
      properties:
        domain: { type: string, description: "Empty = global forwarder; otherwise conditional for this domain and its sub-domains" }
        protocol: { $ref: "#/components/schemas/ForwarderProtocol" }
        address: { type: string, description: "IP address (required for udp/tcp/dot; for doh: bootstrap IP, optional if the URL host is an IP)" }
        port: { type: integer, description: "Default 53 (udp/tcp), 853 (dot), 443 (doh)" }
        tlsServerName: { type: string, description: "Name checked in the certificate (dot), e.g. dns.quad9.net" }
        tlsVerify: { type: boolean, default: true }
        dohUrl: { type: string, example: "https://dns.quad9.net/dns-query" }
        enabled: { type: boolean, default: true }
        position: { type: integer, description: "Order inside its group (0 = first)" }

    Forwarder:
      allOf:
        - $ref: "#/components/schemas/ForwarderInput"
        - type: object
          properties:
            id: { type: string }
            health:
              type: object
              properties:
                healthy: { type: boolean }
                lastError: { type: string }
                lastLatencyMs: { type: number }
                lastCheckAt: { type: [string, "null"], format: date-time }

    ForwarderTest:
      type: object
      properties:
        ok: { type: boolean }
        latencyMs: { type: number }
        rcode: { type: string }
        answers: { type: array, items: { type: string } }
        error: { type: string, description: "French message, e.g. certificat invalide" }
