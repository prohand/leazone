# Leazone - single node.
#
#   cp compose/.env.example compose/.env      # then edit it
#   mkdir -p compose/secrets && touch compose/secrets/admin_password
#   docker compose -f compose/single.yml --env-file compose/.env up -d
#
# Empty admin_password file = a password is generated and shown once in
# "docker logs leazone". Put a password in the file to choose it yourself.
#
# network_mode: host is required for DHCP: the container must receive the
# broadcasts of every interface and VLAN of the host.

name: leazone

services:
  leazone:
    image: ${LEAZONE_IMAGE:-ghcr.io/prohand/leazone:latest}
    # Used by "docker compose build" (or "up --build") when you build locally.
    build:
      context: ..
    container_name: leazone
    restart: unless-stopped
    network_mode: host
    user: "${LEAZONE_UID:-1000}:${LEAZONE_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE   # ports 53 and 67
      - NET_RAW            # DHCP on raw sockets, ping before lease
      # - NET_ADMIN        # only for the virtual IP (HA), see ha-node*.yml
    environment:
      LEAZONE_PUBLIC_URL: ${LEAZONE_PUBLIC_URL:-}
      LEAZONE_TRUSTED_PROXIES: ${LEAZONE_TRUSTED_PROXIES:-}
      LEAZONE_HTTP_LISTEN: ${LEAZONE_HTTP_LISTEN:-:8443}
      LEAZONE_LOG_LEVEL: ${LEAZONE_LOG_LEVEL:-info}
      LEAZONE_ADMIN_USER: ${LEAZONE_ADMIN_USER:-admin}
      LEAZONE_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      # Daily automatic backup in /data/backups (7 kept): uncomment here and
      # in both "secrets" lists, then write a password in secrets/backup_password.
      # LEAZONE_BACKUP_PASSWORD_FILE: /run/secrets/backup_password
      TZ: ${TZ:-Europe/Paris}
    secrets:
      - admin_password
      # - backup_password
    volumes:
      - leazone-config:/config
      - leazone-data:/data
      - leazone-logs:/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  admin_password:
    # Only read on the very first start (empty /data).
    file: ./secrets/admin_password
  # backup_password:
  #   file: ./secrets/backup_password

volumes:
  leazone-config:
  leazone-data:
  leazone-logs:
