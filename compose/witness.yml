# Leazone - witness (tie-breaker), on a THIRD host (small VM, NAS, Raspberry Pi).
# It needs the WITNESS key (not the cluster key) and must be reachable on TCP
# 7443 from both nodes. It stores almost nothing (who is primary, epoch).
# The witness key is derived from the cluster key on a node; it lets the
# witness grant the primary lease but never act as a node.
#
#   # on node 1 (or anywhere the cluster key is), then copy the file to this host:
#   docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/compose/secrets/cluster_key:/run/cluster_key:ro" \
#     -e LEAZONE_CLUSTER_KEY_FILE=/run/cluster_key ghcr.io/prohand/leazone:latest cluster witness-key > witness_key
#   # on this host:
#   mkdir -p compose/secrets && mv witness_key compose/secrets/witness_key
#   docker compose -f compose/witness.yml up -d
#
# Do not copy the cluster key to this host. Older setups that still pass
# LEAZONE_CLUSTER_KEY_FILE keep working, with a warning: see the README
# ("Clé du témoin").
#
# Then on the nodes: LEAZONE_WITNESS=https://<witness-ip>:7443

name: leazone-witness

services:
  witness:
    image: ${LEAZONE_IMAGE:-ghcr.io/prohand/leazone:latest}
    build:
      context: ..
    container_name: leazone-witness
    command: ["witness"]
    restart: unless-stopped
    user: "${LEAZONE_UID:-1000}:${LEAZONE_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]       # no capability needed (port 7443)
    ports:
      - "7443:7443"
    environment:
      LEAZONE_CLUSTER_LISTEN: ":7443"
      LEAZONE_WITNESS_KEY_FILE: /run/secrets/witness_key
      LEAZONE_LOG_LEVEL: ${LEAZONE_LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Paris}
    secrets:
      - witness_key
    volumes:
      - witness-data:/data
    healthcheck:
      test: ["CMD", "/leazone", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

secrets:
  witness_key:
    file: ./secrets/witness_key

volumes:
  witness-data:
