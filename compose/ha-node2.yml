# Leazone - HA node 2 (run on host 2). See README "Haute disponibilité en 5 minutes".
#
#   cp compose/.env.ha.example compose/.env          # same file on both hosts, then edit
#   mkdir -p compose/secrets && touch compose/secrets/admin_password
#   openssl rand -base64 32 > compose/secrets/cluster_key    # once, then copy to node 1, node 2 and the witness
#   docker compose -f compose/ha-node2.yml --env-file compose/.env up -d

name: leazone

services:
  leazone:
    image: ${LEAZONE_IMAGE:-ghcr.io/prohand/leazone:latest}
    build:
      context: ..
    container_name: leazone
    restart: unless-stopped
    network_mode: host
    user: "${LEAZONE_UID:-1000}:${LEAZONE_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE   # ports 53 and 67
      - NET_RAW            # DHCP, ping, gratuitous ARP for the virtual IP
      - NET_ADMIN          # add/remove the virtual IP (remove if LEAZONE_VIP is empty)
    environment:
      LEAZONE_NODE_NAME: ${NODE2_NAME:-node2}
      LEAZONE_PREFERRED_ROLE: secondary
      LEAZONE_CLUSTER_ADDR: https://${NODE2_IP}:7443
      LEAZONE_CLUSTER_PEERS: https://${NODE1_IP}:7443
      LEAZONE_CLUSTER_LISTEN: ${NODE2_IP}:7443
      LEAZONE_WITNESS: ${LEAZONE_WITNESS:-}
      LEAZONE_CLUSTER_KEY_FILE: /run/secrets/cluster_key
      LEAZONE_VIP: ${LEAZONE_VIP:-}
      LEAZONE_VIP_INTERFACE: ${NODE2_VIP_INTERFACE:-}
      LEAZONE_PUBLIC_URL: ${LEAZONE_PUBLIC_URL:-}
      LEAZONE_TRUSTED_PROXIES: ${LEAZONE_TRUSTED_PROXIES:-}
      LEAZONE_HTTP_LISTEN: ${LEAZONE_HTTP_LISTEN:-:8443}
      LEAZONE_LOG_LEVEL: ${LEAZONE_LOG_LEVEL:-info}
      LEAZONE_ADMIN_USER: ${LEAZONE_ADMIN_USER:-admin}
      LEAZONE_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      TZ: ${TZ:-Europe/Paris}
    secrets:
      - admin_password
      - cluster_key
    volumes:
      - leazone-config:/config
      - leazone-data:/data
      - leazone-logs:/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  admin_password:
    file: ./secrets/admin_password
  cluster_key:
    file: ./secrets/cluster_key

volumes:
  leazone-config:
  leazone-data:
  leazone-logs:
